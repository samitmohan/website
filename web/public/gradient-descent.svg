<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 176" width="320" height="176" role="img">
<title>Gradient descent with momentum</title>
<desc>A nimbu on a thread swings across a bowl-shaped loss surface with decaying amplitude, settling at the minimum.</desc>
<style><![CDATA[
  /* The mesh and the nimbu use literals measured to hold on any ground: #8A8A90
     3.29:1, chilli #4E7F35 3.80:1, lemon outline #8A6B14 3.61:1, all clear of the
     3:1 bar for graphical objects over #FAFAFA / #FFFFFF / #0D0D0F / #161618. The
     lemon's fill is only 2.04:1, which is why it carries that outline.
     Text and the thread use currentColor: text cannot be made ground-independent
     (the best single colour tops out at 4.41:1 and AA wants 4.50), so inlining
     this file is what makes the labels correct in every theme state. The colour
     below is scoped to svg:root, which matches only when this file IS the
     document - that is, when it is loaded through an img element, the one case
     that can see nothing but prefers-color-scheme. Inlined in HTML the svg is not
     the root, the rule does not match, and currentColor inherits from the page. */
  svg { --struct:#8A8A90; }
  svg:root { color:#141414; }
  @media (prefers-color-scheme:dark) { svg:root { color:#F2F2F2; } }
  .gd-ring, .gd-rim, .gd-rib { fill:none; stroke:var(--struct); }
  .gd-ring { stroke-width:1; opacity:.34; }
  .gd-rim  { stroke-width:1.2; opacity:.55; }
  .gd-rib  { stroke-width:.8; opacity:.2; }
  .gd-thread { stroke:currentColor; stroke-width:.9; opacity:.5; }
  .gd-chilli { fill:none; stroke:#4E7F35; stroke-width:2.4; stroke-linecap:round; }
  .gd-lemon  { fill:#E3A81E; stroke:#8A6B14; stroke-width:1; }
  .gd-stem   { stroke:#8A6B14; stroke-width:1.4; stroke-linecap:round; }
  .gd-mark { fill:none; stroke:currentColor; stroke-width:1.3; opacity:.75; }
  .gd-dot  { fill:currentColor; }
  .gd-lab { font:9px "Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
            fill:currentColor; }
  .gd-cap { font:7.5px "Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
            letter-spacing:.03em; fill:currentColor; opacity:.6; }
  /* One moving object. transform-box:view-box makes transform-origin read in
     viewBox units, so the group pivots on the thread's anchor. */
  .gd-pend {
    transform-box:view-box; transform-origin:160px 4px;
    animation:gd-swing 7000ms linear infinite, gd-fade 7000ms linear infinite;
  }
  @keyframes gd-swing{0.0%{transform:rotate(-58.00deg)}0.571%{transform:rotate(-55.67deg)}1.143%{transform:rotate(-51.90deg)}1.714%{transform:rotate(-46.88deg)}2.286%{transform:rotate(-40.81deg)}2.857%{transform:rotate(-33.92deg)}3.429%{transform:rotate(-26.44deg)}4.0%{transform:rotate(-18.62deg)}4.571%{transform:rotate(-10.68deg)}5.143%{transform:rotate(-2.86deg)}5.714%{transform:rotate(4.63deg)}6.286%{transform:rotate(11.60deg)}6.857%{transform:rotate(17.88deg)}7.429%{transform:rotate(23.33deg)}8.0%{transform:rotate(27.84deg)}8.571%{transform:rotate(31.34deg)}9.143%{transform:rotate(33.77deg)}9.714%{transform:rotate(35.14deg)}10.286%{transform:rotate(35.45deg)}10.857%{transform:rotate(34.75deg)}11.429%{transform:rotate(33.12deg)}12.0%{transform:rotate(30.64deg)}12.571%{transform:rotate(27.44deg)}13.143%{transform:rotate(23.64deg)}13.714%{transform:rotate(19.38deg)}14.286%{transform:rotate(14.80deg)}14.857%{transform:rotate(10.04deg)}15.429%{transform:rotate(5.25deg)}16.0%{transform:rotate(0.57deg)}16.571%{transform:rotate(-3.88deg)}17.143%{transform:rotate(-7.99deg)}17.714%{transform:rotate(-11.67deg)}18.286%{transform:rotate(-14.82deg)}18.857%{transform:rotate(-17.39deg)}19.429%{transform:rotate(-19.34deg)}20.0%{transform:rotate(-20.65deg)}20.571%{transform:rotate(-21.32deg)}21.143%{transform:rotate(-21.35deg)}21.714%{transform:rotate(-20.78deg)}22.286%{transform:rotate(-19.66deg)}22.857%{transform:rotate(-18.05deg)}23.429%{transform:rotate(-16.02deg)}24.0%{transform:rotate(-13.65deg)}24.571%{transform:rotate(-11.02deg)}25.143%{transform:rotate(-8.22deg)}25.714%{transform:rotate(-5.34deg)}26.286%{transform:rotate(-2.46deg)}26.857%{transform:rotate(0.34deg)}27.429%{transform:rotate(2.99deg)}28.0%{transform:rotate(5.41deg)}28.571%{transform:rotate(7.55deg)}29.143%{transform:rotate(9.37deg)}29.714%{transform:rotate(10.83deg)}30.286%{transform:rotate(11.91deg)}30.857%{transform:rotate(12.60deg)}31.429%{transform:rotate(12.91deg)}32.0%{transform:rotate(12.83deg)}32.571%{transform:rotate(12.41deg)}33.143%{transform:rotate(11.65deg)}33.714%{transform:rotate(10.61deg)}34.286%{transform:rotate(9.33deg)}34.857%{transform:rotate(7.86deg)}35.429%{transform:rotate(6.24deg)}36.0%{transform:rotate(4.53deg)}36.571%{transform:rotate(2.79deg)}37.143%{transform:rotate(1.05deg)}37.714%{transform:rotate(-0.62deg)}38.286%{transform:rotate(-2.18deg)}38.857%{transform:rotate(-3.60deg)}39.429%{transform:rotate(-4.85deg)}40.0%{transform:rotate(-5.90deg)}40.571%{transform:rotate(-6.72deg)}41.143%{transform:rotate(-7.32deg)}41.714%{transform:rotate(-7.68deg)}42.286%{transform:rotate(-7.80deg)}42.857%{transform:rotate(-7.70deg)}43.429%{transform:rotate(-7.39deg)}44.0%{transform:rotate(-6.89deg)}44.571%{transform:rotate(-6.23deg)}45.143%{transform:rotate(-5.42deg)}45.714%{transform:rotate(-4.51deg)}46.286%{transform:rotate(-3.51deg)}46.857%{transform:rotate(-2.47deg)}47.429%{transform:rotate(-1.42deg)}48.0%{transform:rotate(-0.38deg)}48.571%{transform:rotate(0.62deg)}49.143%{transform:rotate(1.54deg)}49.714%{transform:rotate(2.37deg)}50.286%{transform:rotate(3.10deg)}50.857%{transform:rotate(3.70deg)}51.429%{transform:rotate(4.16deg)}52.0%{transform:rotate(4.49deg)}52.571%{transform:rotate(4.67deg)}53.143%{transform:rotate(4.71deg)}53.714%{transform:rotate(4.61deg)}54.286%{transform:rotate(4.40deg)}54.857%{transform:rotate(4.07deg)}55.429%{transform:rotate(3.64deg)}56.0%{transform:rotate(3.14deg)}56.571%{transform:rotate(2.57deg)}57.143%{transform:rotate(1.97deg)}57.714%{transform:rotate(1.33deg)}58.286%{transform:rotate(0.70deg)}58.857%{transform:rotate(0.08deg)}59.429%{transform:rotate(-0.52deg)}60.0%{transform:rotate(-1.06deg)}60.571%{transform:rotate(-1.55deg)}61.143%{transform:rotate(-1.97deg)}61.714%{transform:rotate(-2.31deg)}62.286%{transform:rotate(-2.57deg)}62.857%{transform:rotate(-2.74deg)}63.429%{transform:rotate(-2.83deg)}64.0%{transform:rotate(-2.84deg)}64.571%{transform:rotate(-2.76deg)}65.143%{transform:rotate(-2.61deg)}65.714%{transform:rotate(-2.40deg)}66.286%{transform:rotate(-2.13deg)}66.857%{transform:rotate(-1.81deg)}67.429%{transform:rotate(-1.46deg)}68.0%{transform:rotate(-1.09deg)}68.571%{transform:rotate(-0.71deg)}69.143%{transform:rotate(-0.33deg)}69.714%{transform:rotate(0.05deg)}70.286%{transform:rotate(0.40deg)}70.857%{transform:rotate(0.72deg)}71.429%{transform:rotate(1.00deg)}72.0%{transform:rotate(1.24deg)}72.571%{transform:rotate(1.44deg)}73.143%{transform:rotate(1.58deg)}73.714%{transform:rotate(1.67deg)}74.286%{transform:rotate(1.71deg)}74.857%{transform:rotate(1.70deg)}75.429%{transform:rotate(1.65deg)}76.0%{transform:rotate(1.55deg)}76.571%{transform:rotate(1.41deg)}77.143%{transform:rotate(1.24deg)}77.714%{transform:rotate(1.04deg)}78.286%{transform:rotate(0.83deg)}78.857%{transform:rotate(0.60deg)}79.429%{transform:rotate(0.37deg)}80.0%{transform:rotate(0.00deg)}91.429%,96.429%{transform:rotate(0deg)}96.43900000000001%,100%{transform:rotate(-58.0deg)}}
  @keyframes gd-fade{0%,91.429%{opacity:1}96.429%{opacity:0}96.43900000000001%{opacity:0}100%{opacity:1}}
  /* Motion off: park the nimbu at the minimum, which is the figure's conclusion. */
  @media (prefers-reduced-motion:reduce) {
    .gd-pend { animation:none; transform:rotate(0deg); }
  }
]]></style>
