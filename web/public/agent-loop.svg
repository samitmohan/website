<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 154" width="320" height="154" role="img">
<title>An agent loop</title>
<desc>A pulse circles a think, act and observe loop; four tool calls fire from the act step on every lap.</desc>
<style><![CDATA[
  /* Two colour systems on purpose.
     The geometry uses literals picked to hold on any ground: #8A8A90 measures
     3.29:1 and #556ADC 3.86:1 worst case over #FAFAFA / #FFFFFF / #0D0D0F /
     #161618, both clear of the 3:1 bar for graphical objects.
     The text uses currentColor, because text cannot be made ground-independent:
     the best single colour against #FFFFFF and #0D0D0F tops out at 4.41:1 and AA
     wants 4.50, while a scheme mismatch is 1.07:1 - invisible. currentColor
     inherits the host page's colour, so inlining this file makes the labels
     correct in every theme state (17.65:1). The color below is only the fallback
     for an img element, which gets no CSS from its host and can therefore only
     follow prefers-color-scheme; it is scoped so inlining wins. */
  svg { --struct:#8A8A90; --brand:#556ADC; }
  /* svg:root matches only when this file IS the document, i.e. loaded through an
     img element - the one case that can see nothing but prefers-color-scheme.
     Inlined in HTML the svg is not the root, so this does not match and
     currentColor inherits the page's colour instead of overriding it. */
  svg:root { color:#141414; }
  @media (prefers-color-scheme:dark) { svg:root { color:#F2F2F2; } }
  .al-trace { fill:none; stroke:var(--struct); stroke-width:1; opacity:.3; }
  /* 46 units lit out of a 548 perimeter, chased at constant speed.
     Because the speed is constant, a gate lights at exactly T * s / perimeter and
     nothing can drift out of sync. A loop also never needs a still frame. */
  .al-comet {
    fill:none; stroke:var(--brand); stroke-width:1.6; stroke-linecap:round;
    stroke-dasharray:46 502;
    animation:al-run 4200ms linear infinite;
  }
  @keyframes al-run { from { stroke-dashoffset:0; } to { stroke-dashoffset:-548; } }
  .al-gate { fill:none; stroke:var(--struct); stroke-width:1; opacity:.55; }
  .al-gate-lit { fill:var(--brand); stroke:none; opacity:0;
    animation:al-hit 4200ms linear infinite; }
  /* Window is (gate + comet) / perimeter, so the highlight lasts exactly as long
     as the comet overlaps the gate and two gates can never be lit together. */
  @keyframes al-hit { 0%{opacity:0} 2%{opacity:.24} 10.77%{opacity:.24}
                      12.77%,100%{opacity:0} }
  .al-tool { fill:none; stroke:var(--brand); stroke-width:1; opacity:0;
    animation:al-call 4200ms linear infinite; }
  .al-stub { stroke:var(--brand); stroke-width:1; fill:none; opacity:0;
    animation:al-call 4200ms linear infinite; }
  @keyframes al-call { 0%{opacity:0} 3%{opacity:.9} 14%{opacity:0} 100%{opacity:0} }
  /* Muted text is currentColor at reduced opacity rather than its own grey, so
     it tracks the host colour too instead of drifting off it. */
  .al-lab  { font:8px "Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
             letter-spacing:.08em; fill:currentColor; opacity:.6; }
  .al-name { font:7.5px "Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
             letter-spacing:.04em; fill:currentColor; }
  .al-cap  { font:7.5px "Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
             letter-spacing:.03em; fill:currentColor; opacity:.6; }
  /* Motion off: hold one composed frame with the pulse inside act and the tool
     call raised, rather than freezing wherever the lap happened to be. */
  @media (prefers-reduced-motion:reduce) {
    .al-comet, .al-gate-lit, .al-tool, .al-stub { animation:none; }
    .al-comet { stroke-dasharray:none; opacity:.45; }
    .al-gate-lit { opacity:0; }
    .al-tool, .al-stub { opacity:.65; }
  }
]]></style>
<path class="al-trace" d="M45 74 H275 V118 H45 Z"/><path class="al-comet" d="M45 74 H275 V118 H45 Z"/><line class="al-stub" style="animation-delay:929ms" x1="132.0" y1="40" x2="132.0" y2="52"/><rect class="al-tool" style="animation-delay:929ms" x="124" y="26" width="16" height="14" rx="3"/><line class="al-stub" style="animation-delay:999ms" x1="154.0" y1="40" x2="154.0" y2="52"/><rect class="al-tool" style="animation-delay:999ms" x="146" y="26" width="16" height="14" rx="3"/><line class="al-stub" style="animation-delay:1069ms" x1="176.0" y1="40" x2="176.0" y2="52"/><rect class="al-tool" style="animation-delay:1069ms" x="168" y="26" width="16" height="14" rx="3"/><line class="al-stub" style="animation-delay:1139ms" x1="198.0" y1="40" x2="198.0" y2="52"/><rect class="al-tool" style="animation-delay:1139ms" x="190" y="26" width="16" height="14" rx="3"/><line class="al-stub" style="animation-delay:929ms" x1="132.0" y1="52" x2="198.0" y2="52"/><line class="al-stub" style="animation-delay:929ms" x1="160" y1="52" x2="160" y2="68"/><text class="al-lab" x="165" y="20" text-anchor="middle">tools</text><rect class="al-gate" x="66.0" y="68" width="24" height="12" rx="3"/><rect class="al-gate-lit" style="animation-delay:161ms" x="66.0" y="68" width="24" height="12" rx="3"/><text class="al-name" x="78" y="92" text-anchor="middle">think</text><rect class="al-gate" x="148.0" y="68" width="24" height="12" rx="3"/><rect class="al-gate-lit" style="animation-delay:789ms" x="148.0" y="68" width="24" height="12" rx="3"/><text class="al-name" x="160" y="92" text-anchor="middle">act</text><rect class="al-gate" x="230.0" y="68" width="24" height="12" rx="3"/><rect class="al-gate-lit" style="animation-delay:1418ms" x="230.0" y="68" width="24" height="12" rx="3"/><text class="al-name" x="242" y="92" text-anchor="middle">observe</text><text class="al-cap" x="4" y="140">while not done: think · act · observe</text>
</svg>
