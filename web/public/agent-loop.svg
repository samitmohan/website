<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 154" width="320" height="154" role="img">
<title>An agent loop</title>
<desc>A pulse circles a think, act and observe loop; four tool calls fire from the act step on every lap.</desc>
<style><![CDATA[
  /* Two colour systems on purpose.

     The geometry uses --struct, a single literal that has to clear the 3:1 bar
     for graphical objects on every ground this file lands on. The site is
     light-only now - there is no theme toggle and no .dark class - so that is
     #FFFDF8 and #FFFFFF rather than the four grounds this comment used to
     list. globals.css overrides --struct to a warmed #877F70 (3.90:1 on
     #FFFDF8) when the file is inlined; the #8A8A90 below is the img fallback.

     --brand is the accent. It was demoted to currentColor when the site's
     chrome went greyscale and a second grey could not be told apart from the
     first. There are three accent ramps now - blue on /blog, orange on
     /projects, teal on /about - and globals.css sets --brand to whichever one
     the host page carries, so the drawing is painted in the colour of the page
     it belongs to. currentColor stays as the fallback for the img case.

     The text uses currentColor, because text cannot be made ground-independent.
     Inlined, currentColor inherits the host page's colour and the labels are
     correct; the svg:root rule below is scoped so that inlining always wins. */
  /* Type comes from the page, not from a literal. These files are inlined, so
     var(--font-mono) resolves to the same stack the rest of the site uses -
     Berkeley Mono for anyone who owns it, then the Geist Mono that next/font
     actually ships. Hardcoding "Berkeley Mono" here meant the labels inside a
     drawing fell through to the OS monospace while the text directly beside it
     rendered in Geist Mono. The fallback sits inside var() on purpose: an
     undefined custom property invalidates the whole `font` shorthand, and the
     families after it would not rescue the declaration - and font-size is kept
     out of the shorthand for the same reason, so a renderer that cannot
     resolve the variable loses the typeface and not the text size. */
  svg { font-family:var(--font-mono,ui-monospace),SFMono-Regular,Menlo,monospace; --struct:#8A8A90; --brand:currentColor; }
  /* svg:root matches only when this file IS the document, i.e. loaded through
     an img element - the one case that gets no CSS from a host. Inlined in
     HTML the svg is not the root, this does not match, and currentColor
     inherits the page's colour instead. The site is light-only, so there is no
     prefers-color-scheme override here any more. */
  svg:root { color:#141414; }
  .al-trace { fill:none; stroke:var(--struct); stroke-width:1; opacity:.3; }
  /* 46 units lit out of a 548 perimeter, chased at constant speed.
     Because the speed is constant, a gate lights at exactly T * s / perimeter and
     nothing can drift out of sync. A loop also never needs a still frame. */
  .al-comet {
    fill:none; stroke:var(--brand); stroke-width:1.6; stroke-linecap:round;
    stroke-dasharray:46 502;
    animation:al-run 4200ms linear infinite;
  }
  @keyframes al-run { from { stroke-dashoffset:0; } to { stroke-dashoffset:-548; } }
  .al-gate { fill:none; stroke:var(--struct); stroke-width:1; opacity:.55; }
  .al-gate-lit { fill:var(--brand); stroke:none; opacity:0;
    animation:al-hit 4200ms linear infinite; }
  /* Window is (gate + comet) / perimeter, so the highlight lasts exactly as long
     as the comet overlaps the gate and two gates can never be lit together. */
  @keyframes al-hit { 0%{opacity:0} 2%{opacity:.24} 10.77%{opacity:.24}
                      12.77%,100%{opacity:0} }
  .al-tool { fill:none; stroke:var(--brand); stroke-width:1; opacity:0;
    animation:al-call 4200ms linear infinite; }
  .al-stub { stroke:var(--brand); stroke-width:1; fill:none; opacity:0;
    animation:al-call 4200ms linear infinite; }
  @keyframes al-call { 0%{opacity:0} 3%{opacity:.9} 14%{opacity:0} 100%{opacity:0} }
  /* Muted text is currentColor at reduced opacity rather than its own grey, so
     it tracks the host colour too instead of drifting off it. */
  .al-lab  { font-size:8px;
             letter-spacing:.08em; fill:currentColor; opacity:.6; }
  .al-name { font-size:7.5px;
             letter-spacing:.04em; fill:currentColor; }
  /* Motion off: hold one composed frame with the pulse inside act and the tool
     call raised, rather than freezing wherever the lap happened to be. */
  @media (prefers-reduced-motion:reduce) {
    .al-comet, .al-gate-lit, .al-tool, .al-stub { animation:none; }
    .al-comet { stroke-dasharray:none; opacity:.45; }
    .al-gate-lit { opacity:0; }
    .al-tool, .al-stub { opacity:.65; }
  }
]]></style>
<path class="al-trace" d="M45 74 H275 V118 H45 Z"/><path class="al-comet" d="M45 74 H275 V118 H45 Z"/><line class="al-stub" style="animation-delay:929ms" x1="132.0" y1="40" x2="132.0" y2="52"/><rect class="al-tool" style="animation-delay:929ms" x="124" y="26" width="16" height="14" rx="3"/><line class="al-stub" style="animation-delay:999ms" x1="154.0" y1="40" x2="154.0" y2="52"/><rect class="al-tool" style="animation-delay:999ms" x="146" y="26" width="16" height="14" rx="3"/><line class="al-stub" style="animation-delay:1069ms" x1="176.0" y1="40" x2="176.0" y2="52"/><rect class="al-tool" style="animation-delay:1069ms" x="168" y="26" width="16" height="14" rx="3"/><line class="al-stub" style="animation-delay:1139ms" x1="198.0" y1="40" x2="198.0" y2="52"/><rect class="al-tool" style="animation-delay:1139ms" x="190" y="26" width="16" height="14" rx="3"/><line class="al-stub" style="animation-delay:929ms" x1="132.0" y1="52" x2="198.0" y2="52"/><line class="al-stub" style="animation-delay:929ms" x1="160" y1="52" x2="160" y2="68"/><text class="al-lab" x="165" y="20" text-anchor="middle">tools</text><rect class="al-gate" x="66.0" y="68" width="24" height="12" rx="3"/><rect class="al-gate-lit" style="animation-delay:161ms" x="66.0" y="68" width="24" height="12" rx="3"/><text class="al-name" x="78" y="92" text-anchor="middle">think</text><rect class="al-gate" x="148.0" y="68" width="24" height="12" rx="3"/><rect class="al-gate-lit" style="animation-delay:789ms" x="148.0" y="68" width="24" height="12" rx="3"/><text class="al-name" x="160" y="92" text-anchor="middle">act</text><rect class="al-gate" x="230.0" y="68" width="24" height="12" rx="3"/><rect class="al-gate-lit" style="animation-delay:1418ms" x="230.0" y="68" width="24" height="12" rx="3"/><text class="al-name" x="242" y="92" text-anchor="middle">observe</text>
</svg>
