<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 154" width="320" height="154" role="img">
<title>Forward and backward pass through a small network</title>
<desc>Activations sweep left to right through four layers, the loss flashes at the output, then gradients sweep right to left.</desc>
<style><![CDATA[
  /* A file loaded through an img element can only follow prefers-color-scheme; it
     cannot see a .dark class on the host page. So only the two values that must
     be high-contrast are theme-dependent, and the rest are picked to hold on any
     ground. Measured contrast, worst case over #FAFAFA / #FFFFFF / #0D0D0F /
     #161618: #556ADC 3.86:1, #8A8A90 3.29:1 - both clear the 3:1 bar for
     graphical objects on all four. That way a scheme mismatch only shifts the
     forward pass and the labels; the structure and the gradients stay right. */
  svg { --struct:#8A8A90; --brand:#556ADC; }
  /* Ink and the label grey are currentColor rather than their own literals, so an
     inlined copy inherits the host page's colour and tracks a .dark class. The
     fallback is scoped to svg:root, which matches only when this file IS the
     document - the img case, the one that can see nothing but
     prefers-color-scheme. */
  svg:root { color:#141414; }
  @media (prefers-color-scheme:dark) { svg:root { color:#F2F2F2; } }
  .bp-rest,.bp-fwd,.bp-bwd { fill:none; }
  .bp-rest { stroke:var(--struct); stroke-width:1; opacity:.28; }
  /* Activations in ink, gradients in indigo: the asymmetry between the two
     passes is the only thing this figure is trying to say. */
  .bp-fwd  { stroke:currentColor;   stroke-width:.9;  opacity:0; animation:bp-wave-f 4400ms linear infinite; }
  .bp-bwd  { stroke:var(--brand); stroke-width:1.3; opacity:0; animation:bp-wave-b 4400ms linear infinite; }
  .bp-ring { fill:none; stroke:var(--struct); stroke-width:1; opacity:.6; }
  .bp-lit-f { fill:currentColor;   opacity:0; animation:bp-wave-b 4400ms linear infinite; }
  .bp-lit-b { fill:var(--brand); opacity:0; animation:bp-wave-b 4400ms linear infinite; }
  .bp-loss  { fill:none; stroke:var(--brand); stroke-width:1.4; opacity:0;
            animation:bp-loss 4400ms linear infinite; }
  .bp-lab { font:8px "Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
          letter-spacing:.08em; fill:currentColor; opacity:.6; text-anchor:middle; }
  .bp-cap { font:8px "Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
          letter-spacing:.05em; fill:currentColor; opacity:.6; }
  .bp-cap-r { text-anchor:end; }
  @keyframes bp-wave-f { 0%,1.5%{opacity:0} 5%{opacity:.72} 11%{opacity:0} 100%{opacity:0} }
  @keyframes bp-wave-b { 0%,1.5%{opacity:0} 5%{opacity:.95} 11%{opacity:0} 100%{opacity:0} }
  /* The loss lands in the gap between the passes: activations clear at ~1.7s,
     gradients leave the output at ~2.3s. */
  @keyframes bp-loss { 0%,38%{opacity:0} 42%{opacity:1} 51%{opacity:0} 100%{opacity:0} }
  /* Motion off: hold the whole story as one static figure rather than freezing
     on whichever half-drawn frame the cycle happened to reach. */
  @media (prefers-reduced-motion:reduce) {
    .bp-fwd,.bp-bwd,.bp-lit-f,.bp-lit-b,.bp-loss { animation:none; }
    .bp-fwd { opacity:.42; } .bp-bwd { opacity:.5; }
    .bp-lit-f { opacity:.55; } .bp-lit-b { opacity:0; } .bp-loss { opacity:.8; }
  }
]]></style>
<defs><g id="bp-e0"><line x1="34" y1="56" x2="110" y2="36"/><line x1="34" y1="56" x2="110" y2="68"/><line x1="34" y1="56" x2="110" y2="100"/><line x1="34" y1="56" x2="110" y2="132"/><line x1="34" y1="84" x2="110" y2="36"/><line x1="34" y1="84" x2="110" y2="68"/><line x1="34" y1="84" x2="110" y2="100"/><line x1="34" y1="84" x2="110" y2="132"/><line x1="34" y1="112" x2="110" y2="36"/><line x1="34" y1="112" x2="110" y2="68"/><line x1="34" y1="112" x2="110" y2="100"/><line x1="34" y1="112" x2="110" y2="132"/></g><g id="bp-e1"><line x1="122" y1="36" x2="200" y2="36"/><line x1="122" y1="36" x2="200" y2="68"/><line x1="122" y1="36" x2="200" y2="100"/><line x1="122" y1="36" x2="200" y2="132"/><line x1="122" y1="68" x2="200" y2="36"/><line x1="122" y1="68" x2="200" y2="68"/><line x1="122" y1="68" x2="200" y2="100"/><line x1="122" y1="68" x2="200" y2="132"/><line x1="122" y1="100" x2="200" y2="36"/><line x1="122" y1="100" x2="200" y2="68"/><line x1="122" y1="100" x2="200" y2="100"/><line x1="122" y1="100" x2="200" y2="132"/><line x1="122" y1="132" x2="200" y2="36"/><line x1="122" y1="132" x2="200" y2="68"/><line x1="122" y1="132" x2="200" y2="100"/><line x1="122" y1="132" x2="200" y2="132"/></g><g id="bp-e2"><line x1="212" y1="36" x2="284" y2="70"/><line x1="212" y1="36" x2="284" y2="98"/><line x1="212" y1="68" x2="284" y2="70"/><line x1="212" y1="68" x2="284" y2="98"/><line x1="212" y1="100" x2="284" y2="70"/><line x1="212" y1="100" x2="284" y2="98"/><line x1="212" y1="132" x2="284" y2="70"/><line x1="212" y1="132" x2="284" y2="98"/></g></defs><g class="bp-rest"><use href="#bp-e0"/><use href="#bp-e1"/><use href="#bp-e2"/></g><use href="#bp-e0" class="bp-fwd" style="animation-delay:0ms"/><use href="#bp-e1" class="bp-fwd" style="animation-delay:380ms"/><use href="#bp-e2" class="bp-fwd" style="animation-delay:760ms"/><use href="#bp-e2" class="bp-bwd" style="animation-delay:2300ms"/><use href="#bp-e1" class="bp-bwd" style="animation-delay:2680ms"/><use href="#bp-e0" class="bp-bwd" style="animation-delay:3060ms"/><g class="bp-ring"><circle cx="28" cy="56" r="5"/><circle cx="28" cy="84" r="5"/><circle cx="28" cy="112" r="5"/><circle cx="116" cy="36" r="5"/><circle cx="116" cy="68" r="5"/><circle cx="116" cy="100" r="5"/><circle cx="116" cy="132" r="5"/><circle cx="206" cy="36" r="5"/><circle cx="206" cy="68" r="5"/><circle cx="206" cy="100" r="5"/><circle cx="206" cy="132" r="5"/><circle cx="290" cy="70" r="5"/><circle cx="290" cy="98" r="5"/></g><circle class="bp-lit-f" cx="28" cy="56" r="2.6" style="animation-delay:0ms"/><circle class="bp-lit-f" cx="28" cy="84" r="2.6" style="animation-delay:0ms"/><circle class="bp-lit-f" cx="28" cy="112" r="2.6" style="animation-delay:0ms"/><circle class="bp-lit-f" cx="116" cy="36" r="2.6" style="animation-delay:380ms"/><circle class="bp-lit-f" cx="116" cy="68" r="2.6" style="animation-delay:380ms"/><circle class="bp-lit-f" cx="116" cy="100" r="2.6" style="animation-delay:380ms"/><circle class="bp-lit-f" cx="116" cy="132" r="2.6" style="animation-delay:380ms"/><circle class="bp-lit-f" cx="206" cy="36" r="2.6" style="animation-delay:760ms"/><circle class="bp-lit-f" cx="206" cy="68" r="2.6" style="animation-delay:760ms"/><circle class="bp-lit-f" cx="206" cy="100" r="2.6" style="animation-delay:760ms"/><circle class="bp-lit-f" cx="206" cy="132" r="2.6" style="animation-delay:760ms"/><circle class="bp-lit-f" cx="290" cy="70" r="2.6" style="animation-delay:1140ms"/><circle class="bp-lit-f" cx="290" cy="98" r="2.6" style="animation-delay:1140ms"/><circle class="bp-lit-b" cx="28" cy="56" r="2.6" style="animation-delay:3060ms"/><circle class="bp-lit-b" cx="28" cy="84" r="2.6" style="animation-delay:3060ms"/><circle class="bp-lit-b" cx="28" cy="112" r="2.6" style="animation-delay:3060ms"/><circle class="bp-lit-b" cx="116" cy="36" r="2.6" style="animation-delay:2680ms"/><circle class="bp-lit-b" cx="116" cy="68" r="2.6" style="animation-delay:2680ms"/><circle class="bp-lit-b" cx="116" cy="100" r="2.6" style="animation-delay:2680ms"/><circle class="bp-lit-b" cx="116" cy="132" r="2.6" style="animation-delay:2680ms"/><circle class="bp-lit-b" cx="206" cy="36" r="2.6" style="animation-delay:2300ms"/><circle class="bp-lit-b" cx="206" cy="68" r="2.6" style="animation-delay:2300ms"/><circle class="bp-lit-b" cx="206" cy="100" r="2.6" style="animation-delay:2300ms"/><circle class="bp-lit-b" cx="206" cy="132" r="2.6" style="animation-delay:2300ms"/><circle class="bp-lit-b" cx="290" cy="70" r="2.6" style="animation-delay:1920ms"/><circle class="bp-lit-b" cx="290" cy="98" r="2.6" style="animation-delay:1920ms"/><circle class="bp-loss" cx="311" cy="84" r="4"/><text class="bp-lab" x="28" y="13">x</text><text class="bp-lab" x="116" y="13">h₁</text><text class="bp-lab" x="206" y="13">h₂</text><text class="bp-lab" x="290" y="13">ŷ</text><text class="bp-cap" x="4" y="150">forward →</text><text class="bp-cap bp-cap-r" x="316" y="150">← ∂L/∂w</text>
</svg>
