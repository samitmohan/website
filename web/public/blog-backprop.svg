<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 154" width="320" height="154" role="img">
<title>Forward and backward pass through a small network</title>
<desc>Activations sweep left to right through four layers, the loss flashes at the output, then gradients sweep right to left.</desc>
<style><![CDATA[
  /* Two colour systems on purpose.

     The geometry uses --struct, a single literal that has to clear the 3:1 bar
     for graphical objects on every ground this file lands on. The site is
     light-only now - there is no theme toggle and no .dark class - so that is
     #FFFDF8 and #FFFFFF rather than the four grounds this comment used to
     list. globals.css overrides --struct to a warmed #877F70 (3.90:1 on
     #FFFDF8) when the file is inlined; the #8A8A90 below is the img fallback.

     --brand is the accent. It was demoted to currentColor when the site's
     chrome went greyscale and a second grey could not be told apart from the
     first. globals.css sets --brand to the site's one accent when the file is
     inlined; currentColor stays as the fallback for the img case.

     The text uses currentColor, because text cannot be made ground-independent.
     Inlined, currentColor inherits the host page's colour and the labels are
     correct; the svg:root rule below is scoped so that inlining always wins. */
  /* Type comes from the page, not from a literal. These files are inlined, so
     var(--font-mono) resolves to the same stack the rest of the site uses -
     Berkeley Mono for anyone who owns it, then the Geist Mono that next/font
     actually ships. Hardcoding "Berkeley Mono" here meant the labels inside a
     drawing fell through to the OS monospace while the text directly beside it
     rendered in Geist Mono. The fallback sits inside var() on purpose: an
     undefined custom property invalidates the whole `font` shorthand, and the
     families after it would not rescue the declaration - and font-size is kept
     out of the shorthand for the same reason, so a renderer that cannot
     resolve the variable loses the typeface and not the text size. */
  svg { font-family:var(--font-mono,ui-monospace),SFMono-Regular,Menlo,monospace; --struct:#8A8A90; --brand:currentColor; }
  /* svg:root matches only when this file IS the document, i.e. loaded through
     an img element - the one case that gets no CSS from a host. Inlined in
     HTML the svg is not the root, this does not match, and currentColor
     inherits the page's colour instead. The site is light-only, so there is no
     prefers-color-scheme override here any more. */
  svg:root { color:#141414; }
  /* One edge mesh. There used to be three stacked here - a grey substrate, an
     ink forward layer and an indigo backward layer, each drawing every edge
     over again - which worked while they lit in sequence and became a hairball
     the moment they all held still. At the size this renders, a door thumbnail
     around 460px wide, the drawing has to read as a silhouette rather than as
     a diagram anyone inspects, and it was out-shouting the name above it.
     Which way each pass travels is carried by the two captions along the
     bottom, which is where it was legible anyway. */
  .bp-rest { fill:none; stroke:var(--struct); stroke-width:1; opacity:.3; }

  /* One overlay per edge layer, per direction, all invisible. Nothing here
     turns them on: the stepper on /blog does, by putting class names on an
     ancestor - see .bp-stage in globals.css. Inlined into the page, these are
     ordinary elements in the document, so a rule out there reaches them.

     They are what the old looping animation lit in sequence. Standing still
     and all lit at once they were a hairball, which is why the default is off;
     revealed one layer per click they are the figure doing its job, and the
     click is the only thing on the site that asks for motion. */
  .bp-lay { fill:none; opacity:0; transition: opacity 300ms var(--motion-ease); }
  /* Activations in ink, gradients in the accent. The asymmetry between the two
     passes is the only thing this figure is trying to say. */
  :is(.bp-f0,.bp-f1,.bp-f2) { stroke:currentColor; stroke-width:.9; }
  :is(.bp-b0,.bp-b1,.bp-b2) { stroke:var(--brand); stroke-width:1.3; }
  .bp-ring { fill:none; stroke:var(--struct); stroke-width:1; opacity:.6; }
  /* Nodes in ink, the loss in the accent: the only two things on the drawing
     that are not wiring. */
  .bp-lit-f { fill:currentColor; opacity:.6; }
  .bp-loss  { fill:none; stroke:var(--brand); stroke-width:1.4; opacity:.8; transition: opacity 300ms var(--motion-ease); }
  .bp-lab { font-size:8px;
          letter-spacing:.08em; fill:currentColor; opacity:.6; text-anchor:middle; }
  .bp-cap { font-size:8px;
          letter-spacing:.05em; fill:currentColor; opacity:.6; }
  .bp-cap-r { text-anchor:end; }
]]></style>
<defs><g id="bp-e0"><line x1="34" y1="56" x2="110" y2="36"/><line x1="34" y1="56" x2="110" y2="68"/><line x1="34" y1="56" x2="110" y2="100"/><line x1="34" y1="56" x2="110" y2="132"/><line x1="34" y1="84" x2="110" y2="36"/><line x1="34" y1="84" x2="110" y2="68"/><line x1="34" y1="84" x2="110" y2="100"/><line x1="34" y1="84" x2="110" y2="132"/><line x1="34" y1="112" x2="110" y2="36"/><line x1="34" y1="112" x2="110" y2="68"/><line x1="34" y1="112" x2="110" y2="100"/><line x1="34" y1="112" x2="110" y2="132"/></g><g id="bp-e1"><line x1="122" y1="36" x2="200" y2="36"/><line x1="122" y1="36" x2="200" y2="68"/><line x1="122" y1="36" x2="200" y2="100"/><line x1="122" y1="36" x2="200" y2="132"/><line x1="122" y1="68" x2="200" y2="36"/><line x1="122" y1="68" x2="200" y2="68"/><line x1="122" y1="68" x2="200" y2="100"/><line x1="122" y1="68" x2="200" y2="132"/><line x1="122" y1="100" x2="200" y2="36"/><line x1="122" y1="100" x2="200" y2="68"/><line x1="122" y1="100" x2="200" y2="100"/><line x1="122" y1="100" x2="200" y2="132"/><line x1="122" y1="132" x2="200" y2="36"/><line x1="122" y1="132" x2="200" y2="68"/><line x1="122" y1="132" x2="200" y2="100"/><line x1="122" y1="132" x2="200" y2="132"/></g><g id="bp-e2"><line x1="212" y1="36" x2="284" y2="70"/><line x1="212" y1="36" x2="284" y2="98"/><line x1="212" y1="68" x2="284" y2="70"/><line x1="212" y1="68" x2="284" y2="98"/><line x1="212" y1="100" x2="284" y2="70"/><line x1="212" y1="100" x2="284" y2="98"/><line x1="212" y1="132" x2="284" y2="70"/><line x1="212" y1="132" x2="284" y2="98"/></g></defs><g class="bp-rest"><use href="#bp-e0"/><use href="#bp-e1"/><use href="#bp-e2"/></g><use href="#bp-e0" class="bp-lay bp-f0"/><use href="#bp-e1" class="bp-lay bp-f1"/><use href="#bp-e2" class="bp-lay bp-f2"/><use href="#bp-e2" class="bp-lay bp-b2"/><use href="#bp-e1" class="bp-lay bp-b1"/><use href="#bp-e0" class="bp-lay bp-b0"/><g class="bp-ring"><circle cx="28" cy="56" r="5"/><circle cx="28" cy="84" r="5"/><circle cx="28" cy="112" r="5"/><circle cx="116" cy="36" r="5"/><circle cx="116" cy="68" r="5"/><circle cx="116" cy="100" r="5"/><circle cx="116" cy="132" r="5"/><circle cx="206" cy="36" r="5"/><circle cx="206" cy="68" r="5"/><circle cx="206" cy="100" r="5"/><circle cx="206" cy="132" r="5"/><circle cx="290" cy="70" r="5"/><circle cx="290" cy="98" r="5"/></g><circle class="bp-lit-f" cx="28" cy="56" r="2.6"/><circle class="bp-lit-f" cx="28" cy="84" r="2.6"/><circle class="bp-lit-f" cx="28" cy="112" r="2.6"/><circle class="bp-lit-f" cx="116" cy="36" r="2.6"/><circle class="bp-lit-f" cx="116" cy="68" r="2.6"/><circle class="bp-lit-f" cx="116" cy="100" r="2.6"/><circle class="bp-lit-f" cx="116" cy="132" r="2.6"/><circle class="bp-lit-f" cx="206" cy="36" r="2.6"/><circle class="bp-lit-f" cx="206" cy="68" r="2.6"/><circle class="bp-lit-f" cx="206" cy="100" r="2.6"/><circle class="bp-lit-f" cx="206" cy="132" r="2.6"/><circle class="bp-lit-f" cx="290" cy="70" r="2.6"/><circle class="bp-lit-f" cx="290" cy="98" r="2.6"/><circle class="bp-loss" cx="311" cy="84" r="4"/><text class="bp-lab" x="28" y="13">x</text><text class="bp-lab" x="116" y="13">h₁</text><text class="bp-lab" x="206" y="13">h₂</text><text class="bp-lab" x="290" y="13">ŷ</text><text class="bp-cap" x="4" y="150">forward →</text><text class="bp-cap bp-cap-r" x="316" y="150">← ∂L/∂w</text>
</svg>
