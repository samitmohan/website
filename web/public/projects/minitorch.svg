<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" role="img">
<title>Reverse-mode autodiff</title>
<desc>Values flow forward through x squared and three x into y, then gradients flow back along the same edges and sum at the fork.</desc>
<style><![CDATA[
  /* The site is light-only, so unlike the homepage figures this one is served
     through an img element and can use literals throughout - there is no theme
     for it to track. Greys are the site's own ramp, warmed for the cream
     ground: #877F70 measures 3.55:1 on the #F7F2E6 figure backing where the
     old #8A8A90 was 3.07:1, barely over the 3:1 bar. */
  /* Type comes from the page, not from a literal. These files are inlined, so
     var(--font-mono) resolves to the same stack the rest of the site uses -
     Berkeley Mono for anyone who owns it, then the Geist Mono that next/font
     actually ships. Hardcoding "Berkeley Mono" here meant the labels inside a
     drawing fell through to the OS monospace while the text directly beside it
     rendered in Geist Mono. The fallback sits inside var() on purpose: an
     undefined custom property invalidates the whole `font` shorthand, and the
     families after it would not rescue the declaration - and font-size is kept
     out of the shorthand for the same reason, so a renderer that cannot
     resolve the variable loses the typeface and not the text size. */
  svg { font-family:var(--font-mono,ui-monospace),SFMono-Regular,Menlo,monospace; --ink:#141414; --grey:#877F70; --soft:#D5CFC0; }
  .mt-box { fill:none; stroke:var(--grey); stroke-width:1.1; }
  .mt-lab { font-size:10px;
            fill:var(--ink); text-anchor:middle; }
  .mt-sub { font-size:8px;
            fill:var(--grey); text-anchor:middle; }
  .mt-cap { font-size:8.5px;
            fill:var(--grey); }

  /* Forward edges: drawn in over the first half of the cycle. */
  .mt-f { fill:none; stroke:var(--ink); stroke-width:1.3; stroke-linecap:round;
          stroke-dasharray:120; stroke-dashoffset:120;
          animation:mt-draw 5200ms linear infinite; }
  /* Backward edges: the same geometry, dashed, drawn in the other direction
     over the second half. Direction is the whole point of the figure, so it is
     carried by when they draw rather than by colour. */
  .mt-b { fill:none; stroke:var(--grey); stroke-width:1.1; stroke-linecap:round;
          stroke-dasharray:4 4; stroke-dashoffset:0; opacity:0;
          animation:mt-back 5200ms linear infinite; }
  .mt-grad { opacity:0; animation:mt-grad 5200ms linear infinite; }

  @keyframes mt-draw {
    0%   { stroke-dashoffset:120; }
    26%  { stroke-dashoffset:0; }
    52%  { stroke-dashoffset:0; }
    62%  { stroke-dashoffset:-120; }
    100% { stroke-dashoffset:-120; }
  }
  @keyframes mt-back {
    0%,50%   { opacity:0; }
    58%      { opacity:1; }
    92%      { opacity:1; }
    100%     { opacity:0; }
  }
  @keyframes mt-grad {
    0%,62%   { opacity:0; }
    72%,94%  { opacity:1; }
    100%     { opacity:0; }
  }

  /* Motion off: hold the finished state - both passes drawn, gradient shown -
     rather than freezing on whichever half-drawn frame the cycle reached. */
  @media (prefers-reduced-motion:reduce) {
    .mt-f { animation:none; stroke-dashoffset:0; }
    .mt-b { animation:none; opacity:1; }
    .mt-grad { animation:none; opacity:1; }
  }
]]></style>

<text class="mt-cap" x="12" y="20">reverse-mode autodiff</text>

<!-- forward edges -->
<path class="mt-f" d="M74 96 L150 62" style="animation-delay:0ms"/>
<path class="mt-f" d="M74 108 L150 142" style="animation-delay:120ms"/>
<path class="mt-f" d="M230 62 L300 96" style="animation-delay:900ms"/>
<path class="mt-f" d="M230 142 L300 108" style="animation-delay:1020ms"/>

<!-- backward edges, same geometry -->
<path class="mt-b" d="M300 100 L230 66" style="animation-delay:0ms"/>
<path class="mt-b" d="M300 112 L230 146" style="animation-delay:0ms"/>
<path class="mt-b" d="M150 66 L74 100" style="animation-delay:600ms"/>
<path class="mt-b" d="M150 146 L74 112" style="animation-delay:600ms"/>

<!-- nodes -->
<rect class="mt-box" x="16" y="84" width="58" height="34" rx="8"/>
<text class="mt-lab" x="45" y="100">x = 2</text>
<text class="mt-sub" x="45" y="112">leaf</text>

<rect class="mt-box" x="150" y="46" width="80" height="32" rx="8"/>
<text class="mt-lab" x="190" y="66">x&#178; = 4</text>

<rect class="mt-box" x="150" y="126" width="80" height="32" rx="8"/>
<text class="mt-lab" x="190" y="146">3x = 6</text>

<rect class="mt-box" x="300" y="84" width="64" height="34" rx="8"/>
<text class="mt-lab" x="332" y="100">y = 10</text>
<text class="mt-sub" x="332" y="112">seed 1.0</text>

<!-- the gradient that lands back on the leaf, summed at the fork -->
<g class="mt-grad">
  <text class="mt-lab" x="45" y="140">x.grad = 7</text>
  <text class="mt-sub" x="45" y="152">4 + 3</text>
</g>

<text class="mt-cap" x="12" y="188">forward: values</text>
<text class="mt-cap" x="252" y="188">backward: grads</text>
</svg>
