<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" role="img">
<title>Residual learning</title>
<desc>A residual block with its skip connection, and CIFAR-10 test error against depth: the plain net gets worse from 20 to 56 layers, the residual net gets better. Numbers from the repo's README.</desc>
<style><![CDATA[
  svg { font-family:var(--font-mono,ui-monospace),SFMono-Regular,Menlo,monospace; --grey:var(--muted,#877F70); --soft:var(--surface-2,#D5CFC0); }
  .rn-box { fill:none; stroke:var(--grey); stroke-width:1.1; }
  .rn-lab { font-size:12px; fill:var(--ink); text-anchor:middle; }
  .rn-cap { font-size:12px; fill:var(--grey); }
  .rn-wire { fill:none; stroke:var(--ink); stroke-width:1.2; stroke-linecap:round; }
  .rn-skip { fill:none; stroke:var(--accent,#d9261c); stroke-width:1.5; stroke-linecap:round; }
  .rn-axis { stroke:var(--grey); stroke-width:1; }
  .rn-plain { fill:none; stroke:var(--grey); stroke-width:1.4; stroke-dasharray:4 3; }
  .rn-res { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; }
  .rn-dot { fill:var(--ink); }
  .rn-pdot { fill:var(--grey); }
  @media (prefers-reduced-motion: no-preference) {
    :is(.project-face:hover, .project-face:focus-visible) .rn-skip { animation: rn-draw 900ms cubic-bezier(.3,0,.2,1) backwards; }
    :is(.project-face:hover, .project-face:focus-visible) .rn-res { animation: rn-draw 1100ms cubic-bezier(.3,0,.2,1) 500ms backwards; }
    :is(.project-face:hover, .project-face:focus-visible) .rn-plain { animation: rn-fade 600ms ease-out 300ms backwards; }
  }
  @keyframes rn-draw { from { stroke-dasharray:1 1; stroke-dashoffset:1; } }
  @keyframes rn-fade { from { opacity:0; } }
]]></style>

<!-- residual block -->
<text class="rn-lab" x="92" y="22">x</text>
<line class="rn-wire" x1="92" y1="27" x2="92" y2="38"/>
<rect class="rn-box" x="52" y="38" width="80" height="24" rx="6"/>
<text class="rn-lab" x="92" y="53">3x3 conv</text>
<line class="rn-wire" x1="92" y1="62" x2="92" y2="80"/>
<rect class="rn-box" x="52" y="80" width="80" height="24" rx="6"/>
<text class="rn-lab" x="92" y="95">3x3 conv</text>
<line class="rn-wire" x1="92" y1="104" x2="92" y2="121"/>
<circle class="rn-box" cx="92" cy="130" r="9"/>
<text class="rn-lab" x="92" y="134">+</text>
<line class="rn-wire" x1="92" y1="139" x2="92" y2="156"/>
<text class="rn-lab" x="92" y="170">F(x) + x</text>
<path class="rn-skip" pathLength="1" d="M92 30 H150 Q160 30 160 40 V120 Q160 130 150 130 H101"/>
<text class="rn-cap" x="166" y="84">skip</text>

<!-- test error vs depth, from the README -->
<line class="rn-axis" x1="212" y1="170" x2="368" y2="170"/>
<line class="rn-axis" x1="212" y1="34" x2="212" y2="170"/>
<text class="rn-cap" x="214" y="28">CIFAR-10 test error</text>
<text class="rn-cap" x="219" y="184">20 layers</text>
<text class="rn-cap" x="320" y="184">56</text>
<path class="rn-plain" d="M225 117 L350 47"/>
<circle class="rn-pdot" cx="225" cy="117" r="2.5"/><circle class="rn-pdot" cx="350" cy="47" r="2.5"/>
<text class="rn-cap" x="262" y="44">plain 13.58%</text>
<path class="rn-res" pathLength="1" d="M225 127 L350 146"/>
<circle class="rn-dot" cx="225" cy="127" r="2.5"/><circle class="rn-dot" cx="350" cy="146" r="2.5"/>
<text class="rn-lab" x="324" y="161" style="text-anchor:start">7.47%</text>
<text class="rn-cap" x="232" y="141">resnet</text>
</svg>
