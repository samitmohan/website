<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" role="img">
<title>Research loop</title>
<desc>Claude proposes a change to the training code, it is validated, run with two seeds, and kept only if the metric improves; parents come from the top three experiments.</desc>
<style><![CDATA[
  svg { font-family:var(--font-mono,ui-monospace),SFMono-Regular,Menlo,monospace; --grey:var(--muted,#877F70); --soft:var(--surface-2,#D5CFC0); }
  .ar-node { fill:var(--paper,#fff); stroke:var(--grey); stroke-width:1.1; }
  .ar-on { fill:none; stroke:var(--ink); stroke-width:1.6; opacity:0; }
  .ar-lab { font-size:9.5px; fill:var(--ink); text-anchor:middle; }
  .ar-cap { font-size:9px; fill:var(--grey); }
  .ar-edge { fill:none; stroke:var(--grey); stroke-width:1; }
  .ar-bar { fill:var(--ink); }
  .ar-best { fill:var(--accent,#d9261c); }
  @media (prefers-reduced-motion: no-preference) {
    :is(.project-face:hover, .project-face:focus-visible) .ar-on { animation: ar-lit 420ms ease-out calc(var(--i) * 380ms) both; }
    :is(.project-face:hover, .project-face:focus-visible) .ar-best { animation: ar-grow 700ms cubic-bezier(.3,0,.2,1) 1500ms backwards; transform-origin: 250px 0; }
  }
  @keyframes ar-lit { 0% { opacity:0; } 40% { opacity:1; } 100% { opacity:0; } }
  @keyframes ar-grow { from { transform: scaleX(.5); } }
]]></style>

<!-- the loop -->
<rect class="ar-node" x="20" y="30" width="80" height="28" rx="7"/><rect class="ar-on" style="--i:0" x="20" y="30" width="80" height="28" rx="7"/>
<text class="ar-lab" x="60" y="48">propose</text>
<rect class="ar-node" x="120" y="30" width="80" height="28" rx="7"/><rect class="ar-on" style="--i:1" x="120" y="30" width="80" height="28" rx="7"/>
<text class="ar-lab" x="160" y="48">validate</text>
<rect class="ar-node" x="120" y="120" width="80" height="28" rx="7"/><rect class="ar-on" style="--i:2" x="120" y="120" width="80" height="28" rx="7"/>
<text class="ar-lab" x="160" y="138">run x2 seeds</text>
<rect class="ar-node" x="20" y="120" width="80" height="28" rx="7"/><rect class="ar-on" style="--i:3" x="20" y="120" width="80" height="28" rx="7"/>
<text class="ar-lab" x="60" y="138">keep / drop</text>
<path class="ar-edge" d="M100 44 H118 M113 40 L118 44 L113 48"/>
<path class="ar-edge" d="M160 58 V118 M156 113 L160 118 L164 113"/>
<path class="ar-edge" d="M120 134 H102 M107 130 L102 134 L107 138"/>
<path class="ar-edge" d="M60 120 V60 M56 65 L60 60 L64 65"/>
<text class="ar-cap" x="64" y="94">Claude</text>
<text class="ar-cap" x="20" y="176">every 5th run explores</text>

<!-- leaderboard -->
<text class="ar-cap" x="250" y="40">top 3 parents</text>
<rect class="ar-best" x="250" y="52" width="110" height="14" rx="3"/>
<rect class="ar-bar" x="250" y="74" width="88" height="14" rx="3" opacity=".75"/>
<rect class="ar-bar" x="250" y="96" width="70" height="14" rx="3" opacity=".5"/>
<text class="ar-cap" x="250" y="134">sqlite · dashboard</text>
</svg>
