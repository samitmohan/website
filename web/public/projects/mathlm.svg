<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" role="img">
<title>Training pipeline, tokenizer through reasoning RL</title>
<desc>A run advances through tokenizer, pretrain, SFT and GRPO stages while a loss curve draws downward beneath them.</desc>
<style><![CDATA[
  /* Type comes from the page, not from a literal. These files are inlined, so
     var(--font-mono) resolves to the same stack the rest of the site uses -
     Berkeley Mono for anyone who owns it, then the Geist Mono that next/font
     actually ships. Hardcoding "Berkeley Mono" here meant the labels inside a
     drawing fell through to the OS monospace while the text directly beside it
     rendered in Geist Mono. The fallback sits inside var() on purpose: an
     undefined custom property invalidates the whole `font` shorthand, and the
     families after it would not rescue the declaration - and font-size is kept
     out of the shorthand for the same reason, so a renderer that cannot
     resolve the variable loses the typeface and not the text size. */
  svg { font-family:var(--font-mono,ui-monospace),SFMono-Regular,Menlo,monospace; --ink:#141414; --grey:#877F70; --soft:#D5CFC0; }
  .ml-stage { fill:none; stroke:var(--soft); stroke-width:1.1; }
  .ml-lab { font-size:9.2px;
            fill:var(--grey); text-anchor:middle; }
  .ml-cap { font-size:9.2px;
            fill:var(--grey); }
  .ml-tick { stroke:var(--soft); stroke-width:1; }

  /* All four stages lit. They used to light one at a time across a 6s cycle,
     which turned a pipeline diagram into a chase light; the pipeline is the
     point and all of it is true at once. */
  .ml-on { fill:none; stroke:var(--ink); stroke-width:1.4; opacity:1 }
  .ml-on-lab { fill:var(--ink); opacity:1; }

  /* The loss curve: the thing all four stages are for, and the only quantity
     on the card that means anything. */
  .ml-loss { fill:none; stroke:var(--ink); stroke-width:1.4; stroke-linecap:round; }

  /* At rest this drawing holds still: it ran on a 6s loop, and with every
     figure on the site looping at once nothing on any page was ever at rest,
     which made these read as cartoons rather than as diagrams. What is drawn
     is the finished state.

     Pointing at the card plays the process once and lands on that same state,
     so the motion only runs when someone has asked for it, and leaving the card
     early snaps to the finished drawing rather than to a half-built one. The
     selector reaches the card that inlines this file; reduced motion keeps it
     still. */
  @media (prefers-reduced-motion: no-preference) {
    :is(.project-face:hover, .project-face:focus-visible) :is(.ml-on, .ml-on-lab) {
      animation: ml-lit 260ms var(--motion-ease, ease-out) calc(var(--i) * 300ms) backwards; }
    :is(.project-face:hover, .project-face:focus-visible) .ml-loss {
      animation: ml-draw 1300ms cubic-bezier(.3,0,.2,1) 120ms backwards; }
  }
  @keyframes ml-lit  { from { opacity:0; } to { opacity:1; } }
  @keyframes ml-draw { from { stroke-dasharray:1 1; stroke-dashoffset:1; }
                        to   { stroke-dasharray:1 1; stroke-dashoffset:0; } }

]]></style>

<text class="ml-cap" x="12" y="20">40M params &#183; from scratch</text>

<!-- four stages -->
<g>
  <rect class="ml-stage" x="12"  y="40" width="80" height="30" rx="7"/>
  <rect class="ml-on"    style="--i:0" x="12"  y="40" width="80" height="30" rx="7"/>
  <text class="ml-lab"   x="52"  y="59">tokenizer</text>
  <text class="ml-lab ml-on-lab" style="--i:0" x="52" y="59">tokenizer</text>

  <rect class="ml-stage" x="108" y="40" width="80" height="30" rx="7"/>
  <rect class="ml-on"    style="--i:1" x="108" y="40" width="80" height="30" rx="7"/>
  <text class="ml-lab"   x="148" y="59">pretrain</text>
  <text class="ml-lab ml-on-lab" style="--i:1" x="148" y="59">pretrain</text>

  <rect class="ml-stage" x="204" y="40" width="80" height="30" rx="7"/>
  <rect class="ml-on"    style="--i:2" x="204" y="40" width="80" height="30" rx="7"/>
  <text class="ml-lab"   x="244" y="59">SFT</text>
  <text class="ml-lab ml-on-lab" style="--i:2" x="244" y="59">SFT</text>

  <rect class="ml-stage" x="300" y="40" width="68" height="30" rx="7"/>
  <rect class="ml-on"    style="--i:3" x="300" y="40" width="68" height="30" rx="7"/>
  <text class="ml-lab"   x="334" y="59">GRPO</text>
  <text class="ml-lab ml-on-lab" style="--i:3" x="334" y="59">GRPO</text>
</g>

<!-- loss axis and curve -->
<line class="ml-tick" x1="12" y1="176" x2="368" y2="176"/>
<line class="ml-tick" x1="12" y1="98" x2="12" y2="176"/>
<path class="ml-loss" pathLength="1" d="M12 102 C60 128 84 140 120 148 C160 157 196 162 232 166 C276 170 320 172 368 173"/>
<text class="ml-cap" x="330" y="112">loss</text>
<text class="ml-cap" x="300" y="192">steps &#8594;</text>
</svg>
