<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" role="img">
<title>Tracking a rally</title>
<desc>Court keypoints lock on one by one, two player boxes follow their ends of the court, and the ball travels a rally arc with its interpolated path drawn behind it.</desc>
<style><![CDATA[
  /* The site is light-only, so this carries literals throughout - there is no
     theme for it to track. Greys are the site's ramp, warmed for the cream
     ground: #877F70 measures 3.55:1 on the #F7F2E6 figure backing where the
     old #8A8A90 was 3.07:1, barely over the 3:1 bar for graphical objects.

     This comment used to justify the literals by saying the file was served
     through an img element. It is not: components/project-media inlines it
     through Figure, the same as the homepage drawings.

     The ball is the one thing here in the accent, and it takes it from the
     page rather than naming a colour. It used to hardcode --accent:#E6651B, an
     orange left over from when /projects had its own colourway; with one
     accent on the site that local definition was shadowing the real one and
     putting a fourth hue on a page built out of two. --brand-strong gives the
     rim, so a 4px dot is not carrying the contrast alone. */
  /* Type comes from the page, not from a literal. These files are inlined, so
     var(--font-mono) resolves to the same stack the rest of the site uses -
     Berkeley Mono for anyone who owns it, then the Geist Mono that next/font
     actually ships. Hardcoding "Berkeley Mono" here meant the labels inside a
     drawing fell through to the OS monospace while the text directly beside it
     rendered in Geist Mono. The fallback sits inside var() on purpose: an
     undefined custom property invalidates the whole `font` shorthand, and the
     families after it would not rescue the declaration - and font-size is kept
     out of the shorthand for the same reason, so a renderer that cannot
     resolve the variable loses the typeface and not the text size. */
  svg { font-family:var(--font-mono,ui-monospace),SFMono-Regular,Menlo,monospace; --grey:var(--muted,#877F70); --soft:var(--surface-2,#D5CFC0); }

  .tn-court { fill:none; stroke:var(--grey); stroke-width:1.1; stroke-linejoin:round; }
  .tn-inner { fill:none; stroke:var(--soft); stroke-width:1; }
  .tn-net   { stroke:var(--grey); stroke-width:1; }
  .tn-mesh  { stroke:var(--soft); stroke-width:.6; }
  .tn-lab   { font-size:12px;
              fill:var(--grey); }
  .tn-cap   { font-size:12px;
              fill:var(--grey); }

  /* Keypoints, all found. They used to pop on one at a time over the first
     fifth of a 6s cycle; the regression finding all ten is the state worth
     drawing, and it is the state this holds. */
  .tn-kp { fill:var(--ink); opacity:1; transform:none; }

  /* The boxes used to drift, on the argument that a detector which never moves
     reads as a rectangle drawn on a picture. Two boxes wandering on a loop read
     as a rectangle drawn on a picture that wobbles. What says "tracking" is the
     dashed rally arc through both of them, which does not need to move. */
  .tn-box { fill:none; stroke:var(--ink); stroke-width:1.2; }
  .tn-p1 { }
  .tn-p2 { }

  /* The interpolated path: dashed, sitting under the ball, because filling
     detection gaps is the part of this worth showing. --grey held back with
     opacity rather than --soft, which at 1.39:1 on the backing was so close to
     invisible that the one idea the drawing exists to show did not read. */
  .tn-path { fill:none; stroke:var(--grey); stroke-width:1; stroke-dasharray:3 4;
             opacity:.5; }

  /* The ball, parked on the rally arc at the top of its lob. It used to travel
     the arc on translate keyframes sampled off the two quadratics in the dashed
     path below; the arc is still drawn, so the trajectory reads without the
     ball having to walk it.

     The transform is still a transform and not offset-path. offset-path is the
     tidier way to place this and exactly the wrong tool: where it is
     unsupported the property is dropped, which parks the ball at the user-space
     origin, and a ball in the top-left corner of the card is a worse failure
     than a ball in the wrong place on the court. */
  .tn-ball { transform:translate(176px,92px); }

  /* Fires as the ball reaches the far end and again on the return. */
  .tn-chip { opacity:1; }

  /* At rest this drawing holds still: it ran on a 6s loop, and with every
     figure on the site looping at once nothing on any page was ever at rest,
     which made these read as cartoons rather than as diagrams. What is drawn
     is the finished state.

     Pointing at the card plays the process once and lands on that same state,
     so the motion only runs when someone has asked for it, and leaving the card
     early snaps to the finished drawing rather than to a half-built one. The
     selector reaches the card that inlines this file; reduced motion keeps it
     still. */
  @media (prefers-reduced-motion: no-preference) {
    :is(.project-face:hover, .project-face:focus-visible) .tn-kp {
      animation: tn-lock 240ms var(--motion-ease, ease-out) calc(var(--i) * 50ms) backwards; }
    :is(.project-face:hover, .project-face:focus-visible) .tn-ball {
      animation: tn-rally 1500ms linear 520ms backwards; }
    :is(.project-face:hover, .project-face:focus-visible) .tn-chip {
      animation: tn-read 1500ms linear 520ms backwards; }
  }
  /* transform-box so each dot scales about itself, not the svg origin. */
  .tn-kp { transform-box:fill-box; transform-origin:center; }
  @keyframes tn-lock { from { opacity:0; transform:scale(2.2); } to { opacity:1; transform:none; } }
  /* Sampled off the two quadratics in the dashed path, starting and ending at
     the resting point on the lob, so the ball walks the arc that is drawn. */
  @keyframes tn-rally {
    0.00% { transform:translate(176.0px,92.0px); }
    4.17% { transform:translate(174.1px,85.8px); }
    8.33% { transform:translate(173.1px,79.6px); }
    12.50% { transform:translate(173.0px,73.6px); }
    16.67% { transform:translate(173.8px,68.1px); }
    20.83% { transform:translate(175.4px,62.8px); }
    25.00% { transform:translate(178.0px,58.0px); }
    29.17% { transform:translate(185.5px,65.0px); }
    33.33% { transform:translate(192.1px,71.9px); }
    37.50% { transform:translate(197.8px,78.9px); }
    41.67% { transform:translate(202.4px,85.8px); }
    45.83% { transform:translate(206.2px,92.7px); }
    50.00% { transform:translate(209.0px,99.5px); }
    54.17% { transform:translate(210.9px,106.3px); }
    58.33% { transform:translate(211.8px,113.1px); }
    62.50% { transform:translate(211.8px,119.9px); }
    66.67% { transform:translate(210.8px,126.6px); }
    70.83% { transform:translate(208.9px,133.3px); }
    75.00% { transform:translate(206.0px,140.0px); }
    79.17% { transform:translate(198.8px,131.2px); }
    83.33% { transform:translate(192.4px,122.7px); }
    87.50% { transform:translate(187.0px,114.6px); }
    91.67% { transform:translate(182.4px,106.9px); }
    95.83% { transform:translate(178.8px,99.5px); }
    100.00% { transform:translate(176.0px,92.0px); }
  }
  /* The speed reads out as the ball reaches the far end. */
  @keyframes tn-read { 0%, 22% { opacity:0; } 30%, 100% { opacity:1; } }

]]></style>

<!-- court, in broadcast perspective: far baseline short, near baseline wide -->
<path class="tn-court" d="M132,52 L248,52 L320,168 L60,168 Z"/>
<!-- service boxes -->
<line class="tn-inner" x1="115" y1="80"  x2="265" y2="80"/>
<line class="tn-inner" x1="77"  y1="140" x2="303" y2="140"/>
<line class="tn-inner" x1="190" y1="80"  x2="190" y2="140"/>

<!-- net: a band rather than a line, so the court reads as three dimensions -->
<line class="tn-net" x1="96" y1="100" x2="284" y2="100"/>
<line class="tn-net" x1="96" y1="110" x2="284" y2="110"/>
<line class="tn-net" x1="96" y1="100" x2="96"  y2="110"/>
<line class="tn-net" x1="284" y1="100" x2="284" y2="110"/>
<line class="tn-mesh" x1="120" y1="100" x2="120" y2="110"/>
<line class="tn-mesh" x1="144" y1="100" x2="144" y2="110"/>
<line class="tn-mesh" x1="168" y1="100" x2="168" y2="110"/>
<line class="tn-mesh" x1="192" y1="100" x2="192" y2="110"/>
<line class="tn-mesh" x1="216" y1="100" x2="216" y2="110"/>
<line class="tn-mesh" x1="240" y1="100" x2="240" y2="110"/>
<line class="tn-mesh" x1="264" y1="100" x2="264" y2="110"/>

<!-- keypoints. transform-box/origin so the scale in tn-lock pops about the
     dot itself rather than about the svg origin. -->
<g style="transform-box:fill-box;transform-origin:center">
  <circle class="tn-kp" style="--i:0" cx="132" cy="52"  r="2.4"/>
  <circle class="tn-kp" style="--i:1" cx="248" cy="52"  r="2.4"/>
  <circle class="tn-kp" style="--i:2" cx="115" cy="80"  r="2.4"/>
  <circle class="tn-kp" style="--i:3" cx="265" cy="80"  r="2.4"/>
  <circle class="tn-kp" style="--i:4" cx="190" cy="80"  r="2.4"/>
  <circle class="tn-kp" style="--i:5" cx="190" cy="140" r="2.4"/>
  <circle class="tn-kp" style="--i:6" cx="77"  cy="140" r="2.4"/>
  <circle class="tn-kp" style="--i:7" cx="303" cy="140" r="2.4"/>
  <circle class="tn-kp" style="--i:8" cx="60"  cy="168" r="2.4"/>
  <circle class="tn-kp" style="--i:9" cx="320" cy="168" r="2.4"/>
</g>

<!-- players -->
<g class="tn-p1">
  <rect class="tn-box" x="170" y="29" width="15" height="20" rx="2"/>
  <text class="tn-lab" x="188" y="38">P1</text>
</g>
<g class="tn-p2">
  <rect class="tn-box" x="196" y="132" width="21" height="31" rx="2"/>
  <text class="tn-lab" x="221" y="142">P2</text>
</g>

<!-- rally -->
<path class="tn-path" d="M206,140 Q160,86 178,58 Q226,100 206,140"/>
<g class="tn-ball">
  <circle cx="0" cy="0" r="4" fill="var(--accent, #1C1CA8)" stroke="var(--brand-strong, #141479)" stroke-width="1"/>
</g>

<g class="tn-chip">
  <rect x="286" y="44" width="74" height="15" rx="4" fill="none" stroke="var(--soft)"/>
  <text class="tn-lab" x="293" y="55">118 km/h</text>
</g>

<text class="tn-cap" x="14" y="188">court keypoints &#183; player + ball tracking</text>
</svg>
